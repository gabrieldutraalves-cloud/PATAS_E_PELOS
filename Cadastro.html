<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Patas & Pelos</title>
    <link rel="stylesheet" href="CSS/geral.css">
    <link rel="stylesheet" href="CSS/Cadastro.css">
    <script src="JS/sessao.js" defer></script>
</head>
<body>
<!-- Início Cabeçalho -->
<header class="header">
    <a href="index.html" aria-label="Voltar ao início"><img class="header_img" src="Images/inicio.png" alt="Patas & Pelos"></a>
    <nav class="nav" aria-label="Navegação principal">
        <a href="Loja.html">Loja</a>
        <a href="Servicos.html">Serviços</a>
        <a href="Unidades.html">Unidades</a>
        <a href="agendamento.html">Agendamento</a>
        <a href="Login.html" data-link-conta>Login</a>
    </nav>
</header>
<!-- Fim Cabeçalho -->

<main class="cadastro-fundo">
    <!-- Início formulário de cadastro -->
    <section class="cadastro card">
        <h1>Criar conta</h1>
        <form class="form-cadastro" action="PHP/Cadastro.php" method="post" id="form-cadastro">
            <div class="form-field"><label for="nome">Nome de usuário:</label><input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required maxlength="120"></div>
            <div class="form-field"><label for="email">E-mail:</label><input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required></div>
            <div class="form-field"><label for="senha">Senha:</label><input type="password" id="senha" name="senha" placeholder="Crie sua senha (mínimo de 8 caracteres)" autocomplete="new-password" minlength="8" required></div>
            <div class="form-field"><label for="confirmasenha">Confirmar senha:</label><input type="password" id="confirmasenha" name="confirmasenha" placeholder="Confirme sua senha" autocomplete="new-password" minlength="8" required></div>
            <p id="erro-cadastro" role="alert" class="erro" hidden>As senhas não coincidem.</p>
            <button class="btn btn-dark" type="submit">Cadastrar</button>
        </form>
        <p>Já possui conta? <a href="Login.html">Faça login</a>.</p>
    </section>
    <!-- Fim formulário de cadastro -->
</main>
<script src="JS/cadastro.js" defer></script>
<!-- Início Rodapé -->
<footer class="footer">
    <ul class="footer-list">
        <li>© Patas & Pelos</li>
        <li>Contato: informações a confirmar</li>
        <li><a href="Entregas.html">Entregas</a></li>
        <li><a href="Suporte.html">Suporte</a></li>
    </ul>
</footer>
<!-- Fim Rodapé -->
</body>
</html>
