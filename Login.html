<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Login.css">
    <title>Login</title>
    <!-- Ajustes de alinhamento e responsividade -->
    <link rel="stylesheet" href="CSS/ajustes-visuais.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap">
</head>
<body>
<!--Início Cabeçalho-->
    <header class="header">
            <a href="index.html"><img class="header_img" src="Images/inicio.png" alt="logo"></a>
    </header>
<!--Fim Cabeçalho-->

<!--Início Main-->
    <main>
        
        <form class="login" action="PHP/login.php" method="post">
                
                <div class="formEmail">
                    <label for="email">Usuário:</label>
                    <input type="email" id="email" name="email" required autocomplete="username" placeholder="Digite seu e-mail">
                </div>
        
                <div class="formSenha">
                    <label for="senha">Senha:</label>
                    <input type="password"  id="senha" name="senha" required autocomplete="current-password" placeholder="Digite sua senha">
                </div>

                <button type="submit">Entrar</button>

                <h3>Não possui uma conta? <a href="Cadastro.html">Cadastre-se</a></h3>
            
        </form>

    </main>
<!--Fim Main-->
</body>
</html>
