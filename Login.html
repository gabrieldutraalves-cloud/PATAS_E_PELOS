        <h1 class="somente-leitor">Login</h1>

                <div class="formEmail">
                    <label for="email">Usuário:</label>
                    <input type="email" id="email" name="email" required autocomplete="username" placeholder="Digite seu e-mail">

                <div class="formSenha">
                    <label for="senha">Senha:</label>
                    <input type="password"  id="senha" name="senha" required autocomplete="current-password" placeholder="Digite sua senha">
                </div>

                <button type="submit">Entrar</button>

                <p class="cadastro-link">Não possui uma conta? <a href="Cadastro.html">Cadastre-se</a></p>
            
        </form>
