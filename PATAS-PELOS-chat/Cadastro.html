<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Cadastro.css">
    <title>Cadastro</title>
    <!-- Ajustes de alinhamento e responsividade -->
    <link rel="stylesheet" href="CSS/ajustes-visuais.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap">
</head>
<body>
<!--Início Cabeçalho-->
    <header class="header">
        
        <a href="index.html"><img class="header_img" src="Images/inicio.png" alt="logo"></a>

        <nav class="nav">
            
            <Ul>
                <li>Cadastro</li>
            </Ul>
        </nav>
    </header>
<!--Fim Cabeçalho-->

<!--Início Main-->
    <main>
        
        <div class="cadastro">

        <form action="./PHP/cadastro.php" method="post" class="form">
            <label for="nome">Nome de usuário:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

            

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

            

                
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

            
    
            <label for="confirmasenha">Confirmar senha:</label>
            <input type="password"  id="confirmasenha" name="confirmasenha" placeholder="Digite sua senha">

            

            <div class="cadastro-acao"><button type="submit">Cadastrar</button></div>
        </form>
            
        </div>

    </main>
<!--Fim Main-->
</body>
</html>
