<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/agendamento.css">
    <title>Agendamento</title>
    <!-- Ajustes de alinhamento e responsividade -->
    <link rel="stylesheet" href="CSS/ajustes-visuais.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap">
</head>
<body class="pagina-agendamento">
<!--Início Cabeçalho-->
<header class="header">        
    <a href="index.php"><img class="header_img" src="Images/inicio.png" alt="logo"></a>
    <nav class="nav">
        <Ul>
            <li>
                Agendamento
            </li>
        </Ul>
    </nav>
</header>
<!--Fim Cabeçalho-->

<div class="Agendamento">
    <!--Área de agendamento-->
    <article class="agendar">
        <h3>
            Agendamento
        </h3>
        <form action="PHP/agendamento.php" method="post">
        <div class="campo-agendamento">
            <!--Unidade-->
                <label for="Unidade">Unidade:</label>
                    <select name="Unidade" id="Unidade" required>
                        <option value="">
                            Selecione a unidade
                        </option>
                        <option value="UnidadeCentro">
                            Unidade Centro
                        </option>
                        <option value="UnidadeSul">
                            Unidade Sul
                        </option>
                    </select>
        </div>
        <!--Serviço-->
        <div class="campo-agendamento">
                <label for="Servico">Serviço:</label>
                    <select name="Servico" id="Servico" required>
                        <option value="">
                            Selecione o serviço
                        </option>
                        <option value="banho&tosaSimples">
                            Banho e tosa simples
                        </option>
                        <option value="banho&tosa_c/_hidratacao">
                            Banho e tosa com hidratação
                        </option>
                        <option value="banho&tosaPremium">
                            Banho e tosa premium
                        </option>
                    </select>
        </div>
        <!--Dia & horário-->
        <div class="campo-agendamento">
                <label for="data">
                    Data e horário: 
                </label>
                <input type="datetime-local" id="data" name="data" required>
        </div>
        <button type="submit">Agendar</button>
        </form>
    </article>
    <!--Conferir Status Agendamento-->
    <article class="conferirAgendamento">
        <h3>
            Status Agendamento
        </h3>
        <form action="status.php" method="get">
            <label for="protocolo">Protocolo:</label>
            <input type="number" name="protocolo" id="protocolo" min="1" step="1" required placeholder="Ex.: 1">
                <button type="submit">Verificar status</button>
        </form>
    </article>
</div>
</body>
</html>
